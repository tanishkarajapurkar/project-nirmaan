<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round 3: Defusal Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap');
        
        body {
            background-color: #050505;
            color: white;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .hazard-stripes {
            height: 20px;
            background: repeating-linear-gradient(
                45deg,
                #ffe600,
                #ffe600 20px,
                #000000 20px,
                #000000 40px
            );
        }

        .header {
            text-align: center;
            color: #ff003c;
            font-size: 38px;
            margin-top: 10px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff003c;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
        }

        .main-container {
            display: flex;
            justify-content: space-between;
            padding: 20px 50px;
            height: 60vh;
        }

        .side-panel {
            width: 20%;
            background: #111;
            border: 2px solid #333;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 12px;
        }

        .team-name {
            color: #00ffff;
            font-size: 45px;
            margin-bottom: 20px;
            font-family: 'Orbitron', sans-serif;
        }

        .level-text {
            color: #888;
            font-size: 20px;
        }

        .level-number {
            font-size: 60px;
            color: white;
        }

        .warning-panel {
            border-color: #ff003c;
            background: #1a0005;
        }

        .warning-text {
            color: #ff003c;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .penalty {
            font-size: 60px;
            color: #ff003c;
            animation: pulse 1s infinite alternate;
        }

        .center-panel {
            width: 54%;
            text-align: center;
        }

        .timer-box {
            border: 4px solid #ff003c;
            padding: 10px;
            background: #1a0005;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        #timer {
            font-size: 90px;
            color: #ff3366;
            text-shadow: 0 0 20px #ff003c;
            margin: 0;
            line-height: 1;
        }

        .puzzle-box {
            border: 2px dashed #00ffff;
            min-height: 260px;
            background: #0d1a26;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            padding: 20px 30px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        #puzzle-title {
            color: #00ffff;
            font-size: 26px;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 12px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        #puzzle-clue {
            color: #ffffff;
            font-size: 20px;
            line-height: 1.4;
            max-width: 90%;
            margin-bottom: 10px;
        }

        #puzzle-component {
            color: #f6d148;
            font-size: 18px;
            font-style: italic;
        }

        /* Wires Section */
        .wires-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 15px;
        }

        .wire-wrap {
            text-align: center;
        }

        .wire {
            width: 22px;
            height: 90px;
            background: #fff;
            margin: 10px auto;
            border-radius: 10px;
            transition: 0.3s;
        }

        .status {
            color: #888;
            font-size: 20px;
        }

        /* States */
        .intact { background: #00aaff; box-shadow: 0 0 15px #00aaff; }
        .cut { background: #333 !important; box-shadow: none !important; }
        .cut-text { color: #00ff00 !important; }

        @keyframes pulse {
            from { text-shadow: 0 0 10px #ff003c; }
            to { text-shadow: 0 0 30px #ff003c, 0 0 50px #ff003c; }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Badges & Overlays */
        #backend-status {
            position: fixed;
            top: 25px;
            left: 25px;
            font-size: 13px;
            background: rgba(0,0,0,0.85);
            border: 1px solid #00ff80;
            color: #00ff80;
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .leaderboard-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 8px 18px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            z-index: 100;
            transition: 0.3s;
        }
        .leaderboard-btn:hover { background: #00ffff; color: #000; }

        .leaderboard-panel {
            position: fixed;
            top: 0; right: -420px;
            width: 380px; height: 100vh;
            background: rgba(10, 5, 20, 0.96);
            border-left: 3px solid #00ffff;
            box-shadow: -10px 0 30px rgba(0,0,0,0.9);
            z-index: 99;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 80px 20px 20px 20px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .leaderboard-panel.active { right: 0; }

        .leaderboard-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid #ff003c;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 8px;
        }
        .leaderboard-card.defused {
            border-color: #00ff80;
        }
    </style>
</head>
<body>

    <div class="hazard-stripes"></div>

    <!-- BACKEND STATUS BADGE -->
    <div id="backend-status">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#00ff80; box-shadow:0 0 8px #00ff80;"></span>
        <span id="backend-status-text">Connecting to MongoDB...</span>
    </div>

    <!-- LEADERBOARD BUTTON & DRAWER -->
    <button class="leaderboard-btn" onclick="toggleLeaderboard()">🏆 LEADERBOARD (Press L)</button>
    <div class="leaderboard-panel" id="leaderboardPanel"></div>

    <div class="header">SYSTEM COMPROMISED: DEFUSAL REQUIRED</div>

    <div class="main-container" id="main-body">
        
        <!-- Left Panel: Team Info -->
        <div class="side-panel">
            <div class="team-name" id="team-name">TEAM 1</div>
            <div class="level-text">LEVEL</div>
            <div class="level-number"><span id="current-level">1</span> / 5</div>
        </div>

        <!-- Center Panel: Timer & Puzzle -->
        <div class="center-panel">
            <div class="timer-box">
                <h1 id="timer">01:30.00</h1>
            </div>
            
            <div class="puzzle-box">
                <h2 id="puzzle-title">[ LOADING ENCRYPTION PUZZLE... ]</h2>
                <div id="puzzle-clue">Initializing wire sequence from database...</div>
                <div id="puzzle-component"></div>
            </div>
        </div>

        <!-- Right Panel: Penalty -->
        <div class="side-panel warning-panel">
            <div class="warning-text">WARNING!</div>
            <div class="level-text">WRONG ANSWER</div>
            <div class="penalty">-10 SEC</div>
        </div>

    </div>

    <!-- Wires Section -->
    <div class="wires-container">
        <div class="wire-wrap"><div class="status" id="stat-1">WIRE 1</div><div class="wire intact" id="wire-1"></div></div>
        <div class="wire-wrap"><div class="status" id="stat-2">WIRE 2</div><div class="wire intact" id="wire-2"></div></div>
        <div class="wire-wrap"><div class="status" id="stat-3">WIRE 3</div><div class="wire intact" id="wire-3"></div></div>
        <div class="wire-wrap"><div class="status" id="stat-4">WIRE 4</div><div class="wire intact" id="wire-4"></div></div>
        <div class="wire-wrap"><div class="status" id="stat-5">WIRE 5</div><div class="wire intact" id="wire-5"></div></div>
    </div>

    <div class="hazard-stripes" style="position: absolute; bottom: 0; width: 100%;"></div>

    <script>
        const API_BASE = (window.location.origin && window.location.origin.includes('http')) 
            ? (window.location.port === '5000' ? window.location.origin : 'http://localhost:5000') 
            : 'http://localhost:5000';

        let timeLeft = 90000; // 90 seconds in milliseconds
        let timerInterval;
        let isRunning = false;
        let currentLevel = 1;
        let selectedTeamNum = 1;
        let penaltiesCount = 0;
        let wiresCutArray = [];

        // Fallback engineering puzzles
        let puzzles = [
            { level: 1, title: "PRIMARY LOGIC GATE", clue: "I output high only when both my inputs agree to be true. Which component am I?", componentName: "AND Gate IC (7408)" },
            { level: 2, title: "POWER REGULATION DECOUPLING", clue: "I store electrical energy in an electric field and block DC while passing AC noise. Cut my bypass wire!", componentName: "Electrolytic Capacitor" },
            { level: 3, title: "REVERSE BREAKDOWN DIODE", clue: "I allow current in forward bias like normal, but conduct safely in reverse bias at a specified breakdown voltage.", componentName: "Zener Diode" },
            { level: 4, title: "STRUCTURAL LOAD BEARING", clue: "In beam mechanics, I represent the cross-sectional resistance against bending moments. Cut the neutral axis trace!", componentName: "Section Modulus (I/y)" },
            { level: 5, title: "MASTER TIMING CRYSTAL", clue: "I generate precise clock oscillations using the piezoelectric effect to keep the detonator synchronized.", componentName: "Quartz Crystal Oscillator" }
        ];

        const timerDisplay = document.getElementById('timer');
        const levelDisplay = document.getElementById('current-level');
        const bodyElement = document.getElementById('main-body');
        const teamNameDisplay = document.getElementById('team-name');
        const puzzleTitle = document.getElementById('puzzle-title');
        const puzzleClue = document.getElementById('puzzle-clue');
        const puzzleComponent = document.getElementById('puzzle-component');
        const leaderboardPanel = document.getElementById('leaderboardPanel');

        function updateDbBadge(isOnline, text) {
            const badge = document.getElementById('backend-status');
            const txt = document.getElementById('backend-status-text');
            if (badge && txt) {
                badge.style.borderColor = isOnline ? '#00ff80' : '#f6d148';
                badge.style.color = isOnline ? '#00ff80' : '#f6d148';
                badge.firstElementChild.style.background = isOnline ? '#00ff80' : '#f6d148';
                badge.firstElementChild.style.boxShadow = isOnline ? '0 0 8px #00ff80' : '0 0 8px #f6d148';
                txt.innerText = text;
            }
        }

        function updatePuzzleUI() {
            if (currentLevel <= 5 && puzzles[currentLevel - 1]) {
                const p = puzzles[currentLevel - 1];
                puzzleTitle.innerText = `[ LEVEL ${currentLevel}: ${p.title} ]`;
                puzzleClue.innerText = `"${p.clue}"`;
                puzzleComponent.innerText = `Target Component: ${p.componentName || ''}`;
                puzzleTitle.style.color = "#00ffff";
            }
        }

        function updateDisplay() {
            if (timeLeft <= 0) {
                timerDisplay.innerText = "00:00.00";
                timerDisplay.style.color = "red";
                puzzleTitle.innerText = "BOMB DETONATED!";
                puzzleTitle.style.color = "red";
                puzzleClue.innerText = "Time has expired. Facility lockdown engaged.";
                puzzleComponent.innerText = "";
                clearInterval(timerInterval);
                isRunning = false;

                // Record detonated session to MongoDB
                saveSessionToBackend('detonated');
                return;
            }

            let minutes = Math.floor(timeLeft / 60000);
            let seconds = Math.floor((timeLeft % 60000) / 1000);
            let ms = Math.floor((timeLeft % 1000) / 10);

            timerDisplay.innerText = 
                (minutes < 10 ? "0" : "") + minutes + ":" + 
                (seconds < 10 ? "0" : "") + seconds + "." + 
                (ms < 10 ? "0" : "") + ms;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
            } else {
                if(timeLeft > 0 && currentLevel <= 5) {
                    isRunning = true;
                    timerInterval = setInterval(() => {
                        timeLeft -= 10;
                        updateDisplay();
                    }, 10);
                }
            }
        }

        function correctAnswer() {
            if(currentLevel > 5 || timeLeft <= 0 || !isRunning) return;

            // Cut the current wire
            document.getElementById(`wire-${currentLevel}`).classList.remove('intact');
            document.getElementById(`wire-${currentLevel}`).classList.add('cut');
            wiresCutArray.push(currentLevel);
            
            let statText = document.getElementById(`stat-${currentLevel}`);
            statText.innerText = "DEFUSED";
            statText.classList.add('cut-text');

            if (currentLevel === 5) {
                clearInterval(timerInterval);
                isRunning = false;
                timerDisplay.style.color = "#00ff00"; // Green color for win
                puzzleTitle.innerText = "BOMB DEFUSED! TEAM WINS!";
                puzzleTitle.style.color = "#00ff00";
                puzzleClue.innerText = "All circuits neutralized safely in record time!";
                puzzleComponent.innerText = "DEFUSAL SUCCESSFUL";

                // Record defused session to MongoDB
                saveSessionToBackend('defused');
            } else {
                currentLevel++;
                levelDisplay.innerText = currentLevel;
                updatePuzzleUI();
            }
        }

        function wrongAnswer() {
            if(timeLeft <= 0 || !isRunning || currentLevel > 5) return;
            
            timeLeft -= 10000; // Subtract 10 seconds
            penaltiesCount++;
            if(timeLeft < 0) timeLeft = 0;
            
            // Screen shake effect
            bodyElement.classList.remove('shake');
            void bodyElement.offsetWidth; // trigger reflow
            bodyElement.classList.add('shake');
            
            updateDisplay();
        }

        function resetGame() {
            clearInterval(timerInterval);
            isRunning = false;
            timeLeft = 90000;
            currentLevel = 1;
            penaltiesCount = 0;
            wiresCutArray = [];
            levelDisplay.innerText = "1";
            timerDisplay.style.color = "#ff3366";
            
            updatePuzzleUI();
            
            for(let i=1; i<=5; i++) {
                let wire = document.getElementById(`wire-${i}`);
                wire.classList.remove('cut');
                wire.classList.add('intact');
                let statText = document.getElementById(`stat-${i}`);
                statText.innerText = `WIRE ${i}`;
                statText.classList.remove('cut-text');
            }
            updateDisplay();
        }

        async function saveSessionToBackend(status) {
            const timeTakenSec = Math.max(0, 90 - Math.round(timeLeft / 1000));
            const sessionData = {
                teamNumber: selectedTeamNum,
                teamName: `TEAM ${selectedTeamNum}`,
                currentLevel: currentLevel,
                wiresCut: wiresCutArray,
                timeLeftMs: timeLeft,
                timeTakenSeconds: timeTakenSec,
                penaltiesCount: penaltiesCount,
                status: status,
                score: status === 'defused' ? Math.max(10, Math.round(timeLeft / 1000)) : 0
            };

            try {
                await fetch(`${API_BASE}/api/round3/session`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(sessionData)
                });
                console.log('Recorded defusal session to MongoDB');
            } catch (err) {
                console.warn('Failed to record session to backend:', err);
            }
        }

        async function toggleLeaderboard() {
            leaderboardPanel.classList.toggle('active');
            if (leaderboardPanel.classList.contains('active')) {
                renderLeaderboard();
            }
        }

        async function renderLeaderboard() {
            try {
                const res = await fetch(`${API_BASE}/api/round3/leaderboard`);
                if (res.ok) {
                    const json = await res.json();
                    if (json.success && json.data.length > 0) {
                        let html = `<h2 style="color:#00ffff; font-family:'Orbitron'; text-align:center; margin-bottom:20px;">ROUND 3 SCORES</h2>`;
                        json.data.forEach((rec, idx) => {
                            const isWin = rec.status === 'defused';
                            html += `
                                <div class="leaderboard-card ${isWin ? 'defused' : ''}">
                                    <div style="display:flex; justify-content:space-between; align-items:center;">
                                        <span style="color:#ff00ff; font-weight:bold; font-size:18px;">#${idx+1} ${rec.teamName}</span>
                                        <span style="color:${isWin ? '#00ff80':'#ff003c'}; font-weight:bold;">${rec.status.toUpperCase()}</span>
                                    </div>
                                    <div style="font-size:14px; color:#aaa; margin-top:6px;">
                                        ⏱️ Time Taken: <b style="color:#fff;">${rec.timeTakenSeconds}s</b> &nbsp;|&nbsp; 
                                        ⚠️ Penalties: <b style="color:#ff003c;">${rec.penaltiesCount}</b><br>
                                        ⭐ Score: <b style="color:#f6d148;">${rec.score} pts</b>
                                    </div>
                                </div>
                            `;
                        });
                        leaderboardPanel.innerHTML = html;
                        return;
                    }
                }
            } catch (err) {
                console.warn('Could not fetch leaderboard:', err);
            }
            leaderboardPanel.innerHTML = `<h3 style="color:#fff; text-align:center;">No attempts recorded yet.</h3>`;
        }

        async function loadPuzzlesFromBackend() {
            try {
                updateDbBadge(false, 'Connecting to MongoDB...');
                const res = await fetch(`${API_BASE}/api/round3/puzzles`);
                if (res.ok) {
                    const json = await res.json();
                    if (json.success && json.data && json.data.length > 0) {
                        puzzles = json.data;
                        updateDbBadge(true, `MongoDB (${puzzles.length} Puzzles)`);
                        updatePuzzleUI();
                        return;
                    }
                }
            } catch (err) {
                console.warn('Backend server unreachable, using offline fallback', err);
            }
            updateDbBadge(false, 'Local Mode');
            updatePuzzleUI();
        }

        // Keyboard Controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleTimer();
            } else if (e.code === 'KeyC') {
                correctAnswer();
            } else if (e.code === 'KeyX') {
                wrongAnswer();
            } else if (e.code === 'KeyR') {
                resetGame();
            } else if (e.code === 'KeyL') {
                toggleLeaderboard();
            } else if (['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5'].includes(e.code)) {
                let teamNum = parseInt(e.code.replace('Digit', ''));
                selectedTeamNum = teamNum;
                teamNameDisplay.innerText = "TEAM " + teamNum;
                resetGame();
            }
        });

        // Initialize backend puzzles and display
        loadPuzzlesFromBackend();
        updateDisplay();
    </script>
</body>
</html>
